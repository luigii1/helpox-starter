<!doctype html>
<html lang="fi">
<title>Helpox – Ohjekirja</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#EEF1F4; --paper:#FFFFFF; --ink:#1F2630; --dim:#5E6875; --line:#D5DBE2;
  --shadow:0 1px 2px rgba(31,38,48,.06),0 8px 24px rgba(31,38,48,.06);
  --done:#2F9E44; --wait:#D99A00; --bad:#D83A2E; --work:#1E5AA8;
  --font:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#13171C; --paper:#1C2128; --ink:#E8ECF1; --dim:#9AA5B2; --line:#2E3640;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --done:#4CC364; --wait:#F2B51C; --bad:#F0584C; --work:#5B9BEA;
}}
:root[data-theme="dark"]{
  --ground:#13171C; --paper:#1C2128; --ink:#E8ECF1; --dim:#9AA5B2; --line:#2E3640;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --done:#4CC364; --wait:#F2B51C; --bad:#F0584C; --work:#5B9BEA;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground)}
body{margin:0;color:var(--ink);font:15px/1.5 var(--font);padding-inline:16px;padding-block:16px 40px;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--work);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand{flex:1;min-width:0;font-weight:700;font-size:16px;letter-spacing:.01em}
.brand span{font-weight:400;color:var(--dim);margin-left:8px;font-size:13px}
header .progress{flex:none}

/* overall progress */
.progress{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--dim)}
.progress b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.track{position:relative;flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.track .f{position:absolute;inset:0 auto 0 0;background:var(--done)}
@media (prefers-reduced-motion:no-preference){.track .f{transition:width .4s ease}}

/* manual */
.manual{background:var(--paper);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.page-h{padding:20px 20px 10px;text-align:center}
.pnum{font:700 32px/1 var(--font);font-variant-numeric:tabular-nums;color:var(--dim)}
.page-h h2{margin:6px 0 0;font-size:21px;font-weight:700}
.page-h p{margin:4px 0 0;color:var(--dim);font-size:14px}

.checklist{list-style:none;margin:0;padding:8px 14px 18px;display:flex;flex-direction:column;gap:2px}
.item{border-radius:8px}
.row{display:flex;align-items:flex-start;gap:10px;width:100%;min-width:0;background:none;border:0;text-align:left;padding:10px 8px;border-radius:8px;cursor:pointer}
.row:hover{background:var(--ground)}
.check{flex:none;width:20px;height:20px;margin-top:1px;border-radius:5px;border:2px solid var(--line);display:grid;place-items:center}
.check svg{width:13px;height:13px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check.on{background:var(--done);border-color:var(--done)}
.check.on svg{opacity:1}
.check.wait{border-color:var(--wait)}
.check.bad{border-color:var(--bad)}
.check.active{border-color:var(--work)}
.check.active:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--work)}
.title{flex:1;min-width:0;font-size:15px;line-height:1.35;padding-top:1px;overflow-wrap:break-word}
.item.done .title{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--line)}
.tag{display:inline-block;margin-left:7px;font-size:11.5px;font-weight:500;padding:1px 7px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.tag.wait{background:var(--wait);color:#1F2630}
.tag.bad{background:var(--bad);color:#fff}
.tag.active{background:var(--work);color:#fff}

.detail{margin:0 8px 8px;padding:10px 12px;border-radius:8px;background:var(--ground);display:grid;gap:8px;font-size:13.5px}
.detail h4{margin:0 0 2px;font-size:11px;font-weight:500;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.detail p,.detail ul{margin:0;color:var(--ink)}
.detail ul{padding-left:18px}
.ok{color:var(--done)} .no{color:var(--bad)}
.checkbox-note{border:1px dashed var(--wait);border-radius:6px;padding:8px 10px}

/* bottom pager */
.pager{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 18px 18px;border-top:1px solid var(--line)}
.arrow{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:17px;line-height:1;display:grid;place-items:center}
.arrow:disabled{opacity:.35;cursor:default}
.arrow:not(:disabled):hover{border-color:var(--ink)}
.pager .loc{font-size:13px;color:var(--dim);min-width:74px;text-align:center;font-variant-numeric:tabular-nums}

.empty{background:var(--paper);border-radius:12px;box-shadow:var(--shadow);padding:24px;text-align:center;color:var(--dim);font-size:14px}
</style>

<div class="wrap">
  <header>
    <div class="brand">Helpox<span id="proj">helpox-starter · ohjekirja</span></div>
    <div class="progress" id="progressTop"><b id="progressFrac"></b></div>
  </header>

  <div class="progress"><div class="track" id="track"><div class="f" id="trackFill"></div></div></div>

  <section class="manual" id="manual" aria-label="Ohjekirja">
    <div class="page-h" id="pageH"></div>
    <ol class="checklist" id="checklist"></ol>
    <div class="pager">
      <button class="arrow" id="prevBtn" aria-label="Edellinen sivu">←</button>
      <span class="loc" id="loc"></span>
      <button class="arrow" id="nextBtn" aria-label="Seuraava sivu">→</button>
    </div>
  </section>
</div>

<script>
const EMBEDDED = /*__EMBED__*/null;
const STATUS_FI={todo:'Odottaa',building:'Rakenteilla',inspecting:'Tarkastetaan',rework:'Korjataan',awaiting_commander:'Tarkistakaa itse',approved:'Valmis'};
const ACTIVE=['building','inspecting','rework'];
const NS='http://www.w3.org/2000/svg';

let state={map:EMBEDDED,inspections:[]},page=null,sel=null;

function h(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function s(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}

function current(m){
  const st=Object.fromEntries(m.bricks.map(b=>[b.id,b.status]));
  const a=m.bricks.find(b=>ACTIVE.includes(b.status)); if(a) return a;
  const w=m.bricks.find(b=>b.status==='awaiting_commander'); if(w) return w;
  const n=m.bricks.find(b=>b.status==='todo'&&b.depends_on.every(d=>st[d]==='approved')); if(n) return n;
  return null;
}

function checkClass(status){
  if(status==='approved')return 'on';
  if(status==='awaiting_commander')return 'wait';
  if(status==='rework')return 'bad';
  if(ACTIVE.includes(status))return 'active';
  return '';
}
function tag(status){
  if(status==='awaiting_commander')return {cls:'wait',txt:STATUS_FI[status]};
  if(status==='rework')return {cls:'bad',txt:STATUS_FI[status]};
  if(ACTIVE.includes(status))return {cls:'active',txt:STATUS_FI[status]};
  return null;
}

function renderProgress(m){
  const total=m.bricks.length,ok=m.bricks.filter(b=>b.status==='approved').length;
  document.getElementById('progressFrac').textContent=`${ok} / ${total}`;
  document.getElementById('trackFill').style.width=(ok/total*100)+'%';
}

function renderPage(m){
  const mod=m.modules[page];
  const ph=document.getElementById('pageH');ph.textContent='';
  ph.append(h('div','pnum',String(page+1)),h('h2',null,mod.label_fi),h('p',null,mod.about_fi));

  const bs=m.bricks.filter(b=>b.module===mod.id);
  const cur=current(m);
  const ol=document.getElementById('checklist');ol.textContent='';
  bs.forEach(b=>{
    const li=h('li','item'+(b.status==='approved'?' done':''));
    const row=h('button','row');
    const chk=h('span','check '+checkClass(b.status));
    const tick=s('svg',{viewBox:'0 0 24 24'});s('path',{d:'M5 13l5 5L19 7'},tick);chk.appendChild(tick);
    const titleWrap=h('span','title');
    titleWrap.append(document.createTextNode(b.title_fi+' '));
    const t=tag(b.status);
    if(t){const tg=h('span','tag '+t.cls,t.txt);titleWrap.append(tg);}
    row.append(chk,titleWrap);
    row.onclick=()=>{sel=sel===b.id?null:b.id;render();};
    li.append(row);

    const showDetail=sel===b.id||(cur&&cur.id===b.id&&b.status==='awaiting_commander');
    if(showDetail){
      const d=h('div','detail');
      const why=h('div');why.append(h('h4',null,'Miksi'),h('p',null,b.why_fi));d.append(why);
      if(b.status==='awaiting_commander'&&b.commander_check_fi){
        const w=h('div','checkbox-note');w.append(h('h4',null,'Tarkistatte itse'),h('p',null,b.commander_check_fi));d.append(w);
      }
      const r=state.inspections.find(x=>x.brick===b.id);
      if(r){
        const w=h('div');w.append(h('h4',null,'Tarkastajan raportti'),h('p',r.result==='pass'?'ok':'no',r.summary_fi));
        d.append(w);
      }
      li.append(d);
    }
    ol.append(li);
  });
}

function renderPager(m){
  document.getElementById('prevBtn').disabled=page===0;
  document.getElementById('nextBtn').disabled=page===m.modules.length-1;
  document.getElementById('loc').textContent=`Sivu ${page+1} / ${m.modules.length}`;
}

function turn(d){const m=state.map;page=Math.max(0,Math.min(m.modules.length-1,page+d));sel=null;render();}

function render(){
  const m=state.map;
  const manual=document.getElementById('manual');
  if(!m){
    manual.hidden=true;
    let e=document.getElementById('emptyMsg');
    if(!e){e=h('div','empty');e.id='emptyMsg';e.innerHTML='<strong>Ohjekirjaa ei löytynyt.</strong><br>Odotetaan yhteyttä palvelimeen.';document.querySelector('.wrap').append(e);}
    return;
  }
  const e=document.getElementById('emptyMsg');if(e)e.remove();
  manual.hidden=false;
  if(page==null||page>=m.modules.length){const c=current(m);page=c?m.modules.findIndex(x=>x.id===c.module):0;}
  renderProgress(m);renderPage(m);renderPager(m);
}

document.getElementById('prevBtn').onclick=()=>turn(-1);
document.getElementById('nextBtn').onclick=()=>turn(1);
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='ArrowLeft')turn(-1);if(e.key==='ArrowRight')turn(1);});

async function poll(){
  try{
    const [a,b]=await Promise.all([fetch('/docs/build-map.json',{cache:'no-store'}),fetch('/api/inspections',{cache:'no-store'})]);
    if(!a.ok)throw 0;
    state={map:await a.json(),inspections:b.ok?await b.json():[]};
  }catch(e){/* keep showing the last known state */}
  render();
}
render();
if(location.protocol.startsWith('http')){poll();setInterval(poll,4000);}
</script>
