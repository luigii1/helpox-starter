name: Test

# Minimal CI, added by brick D1: runs the RLS test harness against a real
# local Supabase stack, since Docker/supabase.com are unreachable from both
# the build session and the commander's machine (see docs/decisions.md).
# Brick T1 extends this same workflow with typecheck/lint/check:secrets
# rather than adding a second one.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase start

      - name: Export local Supabase URL and keys into the job's env
        run: supabase status -o env >> "$GITHUB_ENV"

      - run: pnpm test
