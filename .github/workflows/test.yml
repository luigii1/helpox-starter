name: Test

# Minimal CI, added by brick D1: runs the RLS test harness against a real
# local Supabase stack, since Docker/supabase.com are unreachable from both
# the build session and the commander's machine (see docs/decisions.md).
# Brick S1 added check:secrets; brick T1 added typecheck/lint here and made
# the `test` check a required GitHub branch protection rule (a one-time
# GitHub Settings action only the commander can do — see docs/decisions.md).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm check:secrets

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase start

      - name: Export local Supabase URL and keys into the job's env
        # `-o env` quotes each value (KEY="value"), which GITHUB_ENV does not
        # unquote on its own — appending it raw leaves the quote characters
        # inside process.env.KEY. Strip a matching pair of surrounding quotes
        # before appending.
        run: supabase status -o env | sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      - run: pnpm test
